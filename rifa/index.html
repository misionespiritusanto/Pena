function telAR(s){let d=String(s||"").replace(/\D/g,"");if(d.indexOf("00")===0)d=d.slice(2);if(d.indexOf("54")===0&&d.length>=12){d=d.slice(2);if(d[0]==="9")d=d.slice(1)}if(d[0]==="0")d=d.slice(1);if(d.length===10&&d.indexOf("15")===0)d="11"+d.slice(2);if(d.length===12){for(const a of [2,3,4])if(d.substr(a,2)==="15"){d=d.slice(0,a)+d.slice(a+2);break}}if(d.length===8)d="11"+d;return d.length===10?"549"+d:""}

function misData(){const by={};T.ventas.forEach(x=>{(by[x.kid]=by[x.kid]||[]).push(x)});const P=CFG.price;
 const L=T.chicos.map(c=>({n:c.n,c:Number(c.c),pag:Number(c.pag)||0,est:c.est||"",ok:1}));Object.keys(by).forEach(k=>{if(!L.some(x=>x.n===k))L.push({n:k,c:0,pag:0,est:"No está en la pestaña Misioneros",ok:0})});
 L.forEach(x=>{x.it=by[x.n]||[];x.k=x.it.filter(y=>!isC(y)).reduce((s,y)=>s+y.q,0);x.debe=Math.max(x.c,x.k)*P;x.saldo=x.debe-x.pag;x.mitad=Math.round(x.debe*CFG.e1p/100)});return L}
function misV(){
 $("#ab").innerHTML=`<div class="card" id="msum"></div>
 <div class="chips" style="margin-top:12px">${[["todos","Todos"],["deben","Deben plata"],["mitad","No llegan a "+(CFG.e1p===50?"la mitad":CFG.e1p+"%")],["faltan","Vendieron menos del cupo"]].map(([k,n])=>`<button class="chip ${MF===k?"on":""}" onclick="MF='${k}';MX=-1;misV()">${n}</button>`).join("")}</div><input id="mq" placeholder="Buscar misionero" oninput="misL()" autocomplete="off"><div id="ml"></div>`;misL()}
function misL(){const L=misData(),A=L.filter(x=>!x.est),ws=words($("#mq")?$("#mq").value:"");$("#msum").innerHTML=`<div class="row"><span>Falta que entreguen</span><b>${money(A.reduce((s,x)=>s+Math.max(0,x.saldo),0))}</b></div><div class="row"><span>No llegan a ${CFG.e1p===50?"la mitad":CFG.e1p+"%"}</span><b>${A.filter(x=>x.pag<x.mitad).length}</b></div><div class="row"><span>Vendieron menos del cupo</span><b>${A.filter(x=>x.k<x.c).length}</b></div>`;let V=L.map((x,i)=>Object.assign(x,{i})).filter(x=>matches(x.n,ws));
 if(MF==="deben")V=V.filter(x=>x.saldo>0);if(MF==="mitad")V=V.filter(x=>x.pag<x.mitad);if(MF==="faltan")V=V.filter(x=>x.k<x.c);
 $("#ml").innerHTML=V.map(x=>`<button class="item" onclick="MX=${MX===x.i?-1:x.i};misL()"><b>${esc(x.n)}</b>${x.est?" ⚠":""}<small>${x.c?x.k+" de "+x.c:x.k+" (a voluntad)"} vendidos · ${x.saldo>0?"debe "+money(x.saldo):x.saldo<0?"a favor "+money(-x.saldo):"al día ✅"}</small></button>${MX===x.i?misD(x):""}`).join("")||`<p class="mut">No hay misioneros con ese filtro.</p>`}
function misD(x){return `<div class="card" style="margin:6px 0 12px">${x.est?`<p class="err" style="margin-top:0">⚠ ${esc(x.est)} (¿le corrigieron el nombre o se dio de baja?).</p>`:""}
 <b>Ventas</b>${x.it.length?x.it.map(p=>`<div class="row" style="align-items:center"><span>${esc(p.n)}<small class="mut" style="display:block">${esc(p.tel)}${p.tel?" · ":""}<span class="nums">${rango(p.del,p.al)}</span></small></span><button class="chip" style="flex:none" onclick="aborrar('${p.id}',this)">Borrar</button></div>`).join(""):`<p class="mut">Ninguna todavía.</p>`}
 <div style="margin-top:12px"><b>Plata</b></div><div class="row"><span>Tiene que entregar</span><b>${money(x.debe)}</b></div><div class="row"><span>Pagó hasta ahora</span><b>${money(x.pag)}</b></div><div class="row"><span>Falta</span><b>${money(x.saldo)}</b></div>
 ${x.ok?`<label>¿Cuánto pagó en total hasta ahora?</label><input id="pm" type="number" inputmode="numeric" step="1000" min="0" value="${x.pag||""}" placeholder="0"><div class="chips" style="margin-top:8px"><button class="chip" onclick="$('#pm').value=${x.mitad}">${CFG.e1p===50?"La mitad":CFG.e1p+"%"} (${money(x.mitad)})</button><button class="chip" onclick="$('#pm').value=${x.debe}">Pagó todo (${money(x.debe)})</button></div><button class="btn pri" onclick="apago(${x.i},this)">Guardar</button><p class="mut" style="font-size:.85rem;margin:0">Es el total que entregó, no lo de hoy. Es lo mismo que la columna “Pagó” de la pestaña Misioneros de la planilla.</p>`:""}</div>`}
async function apago(i,b){const x=misData()[i],v=$("#pm").value.trim(),m=Math.round(Number(v)||0);if(v===""||m<0)return toast("Escribí cuánto pagó en total.");
 b.disabled=true;b.textContent="Guardando…";const r=await adm("pagado",{kid:x.n,total:m}).catch(()=>({ok:false,error:"Sin conexión"}));if(!r.ok){b.disabled=false;b.textContent="Guardar";return toast(r.error)}
 await cargarT();toast("✔ "+x.n+": pagó "+money(m)+" en total");misL()}
async function aborrar(id,b){if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="¿Seguro?";b.classList.add("warn");return}b.disabled=true;const r=await adm("borrar",{id}).catch(()=>({ok:false,error:"Sin conexión"}));if(!r.ok){b.disabled=false;return toast(r.error)}await cargarT();toast("Borrada.");TAB==="ventas"?venL():misL()}

/* ventas: buscar por comprador, celular o número */
function venV(){$("#ab").innerHTML=`<input id="vq" placeholder="Nombre, celular o número de rifa" oninput="venL()" autocomplete="off"><div id="vl"></div>`;$("#vq").focus();venL()}
function venL(){const q=$("#vq").value.trim(),d=q.replace(/\D/g,""),ws=words(q);let L=T.ventas;
 if(!q){L=L.filter(x=>!isC(x)).slice(-15).reverse()}else if(/^\d{1,5}$/.test(q)){const n=Number(q);L=L.filter(x=>n>=x.del&&n<=x.al||(d.length>=4&&String(x.tel).replace(/\D/g,"").includes(d)))}else{L=L.filter(x=>matches(x.n+" "+x.kid,ws)||(d.length>=4&&String(x.tel).replace(/\D/g,"").includes(d)))}
 $("#vl").innerHTML=(q?"":`<p class="mut" style="font-size:.9rem">Últimas ventas anotadas:</p>`)+L.slice(0,40).map(x=>`<div class="card ac"><div class="ach"><b>${esc(x.n)}</b><span class="nums">${rango(x.del,x.al)}</span></div><div class="mut" style="font-size:.9rem">${esc(x.tel)}${x.tel?" · ":""}${x.q} ${x.q===1?"número":"números"} · vendió ${esc(x.kid)}${x.f?" · "+esc(x.f):""}</div><div class="acts">${x.tel?`<a class="btn o" href="${waLink(x,x.kid)}" target="_blank" rel="noopener">📲 WhatsApp</a>`:""}<button class="btn o" onclick="aborrar('${x.id}',this)">Borrar</button></div></div>`).join("")+(L.length>40?`<p class="mut">Hay más: buscá más específico.</p>`:"")+(q&&!L.length?`<p>No encontramos nada.</p>`:"")}

/* resumen */
function resV(){const M=misData(),A=M.filter(x=>!x.est),V=T.ventas,row=(a,b)=>`<div class="row"><span>${a}</span><b>${b}</b></div>`;
 const vend=V.filter(x=>!isC(x)).reduce((s,x)=>s+x.q,0),cie=V.filter(isC).reduce((s,x)=>s+x.q,0),cup=A.reduce((s,x)=>s+x.c,0),fal=A.reduce((s,x)=>s+Math.max(0,x.c-x.k),0);
 const debe=A.reduce((s,x)=>s+x.debe,0),pag=M.reduce((s,x)=>s+x.pag,0);
 $("#ab").innerHTML=`<div class="card">${row("Números vendidos",vend.toLocaleString("es-AR"))}${row("Ventas anotadas",V.filter(x=>!isC(x)).length)}${row("Números de los cupos ("+A.length+" misioneros)",cup.toLocaleString("es-AR"))}${row("Faltan vender (de los cupos)",fal.toLocaleString("es-AR"))}${cie?row("A nombre de misioneros (cierre)",cie.toLocaleString("es-AR")):""}${row("Total de números en el sorteo",(vend+cie).toLocaleString("es-AR"))}</div>
 <div class="card" style="margin-top:12px">${row("Tienen que entregar los misioneros",money(debe))}${row("Ya entregaron",money(pag))}${row("Falta que entreguen",money(debe-pag))}${CFG.meta?row("Meta de la rifa",money(CFG.meta))+row("Si todos pagan, contra la meta",money(debe-CFG.meta)):""}</div>
 <button class="btn o" onclick="T=null;atab('resumen')">Actualizar</button>`}

/* sorteo */
const SK="rifa_sorteo";const drawn=()=>{try{return JSON.parse(sessionStorage.getItem(SK)||"[]")}catch(e){return []}};const setDrawn=a=>{try{sessionStorage.setItem(SK,JSON.stringify(a))}catch(e){}};
function sorV(){const V=T.ventas,tot=V.reduce((s,x)=>s+x.q,0),D=drawn();
 $("#ab").innerHTML=`${CFG.abierta?`<div class="card" style="margin-bottom:12px"><b>La venta está abierta.</b><p style="margin:6px 0">Antes del sorteo, cerrala: los números que cada misionero no vendió quedan a su nombre (los pagó) y entran al sorteo. Después nadie puede anotar ni borrar ventas desde la página.</p><button class="btn" id="cbtn" onclick="cierre(this)">🔒 Cerrar la venta</button></div>`:`<div class="card" style="margin-bottom:12px"><b>✔ La venta está cerrada.</b><p class="mut" style="margin:6px 0 0;font-size:.9rem">Para reabrirla, poner “Sí” en “Venta abierta” (pestaña Config de la planilla).</p></div>`}
 <div id="pres" class="pres"><span><b>${tot.toLocaleString("es-AR")}</b> números en el sorteo</span><small>Cada toque saca un número al azar entre los vendidos</small></div>
 <button class="btn pri" onclick="sacar()" ${tot?"":"disabled"}>🎲 Sacar un número</button><label class="opt"><input type="checkbox" id="vtel"> <span>Mostrar el celular del ganador<small>Dejalo apagado si estás grabando la historia</small></span></label>
 <div class="drawn">${D.length?`<b>Números que salieron</b>`+D.map((d,i)=>`<div class="row"><span>${i+1}° número<small class="mut" style="display:block">${esc(d.n)} · vendió ${esc(d.kid)}${d.tel?" · "+esc(d.tel):""}</small></span><b class="nums">${n4(d.num)}</b></div>`).join("")+`<button class="back" onclick="if(confirm('¿Borrar la lista de números que salieron (por ejemplo, después de una prueba)?')){setDrawn([]);sorV()}">Borrar esta lista</button>`:""}</div>
 <button class="btn o" onclick="imprimir()">🖨 Lista para el sorteo (por número)</button>`}
function sacar(){const V=T.ventas,D=drawn(),usados=new Set(D.map(d=>d.num)),tot=V.reduce((s,x)=>s+x.q,0);if(usados.size>=tot)return toast("Ya salieron todos los números.");
 let num,x;for(let k=0;k<1000;k++){const a=new Uint32Array(1);crypto.getRandomValues(a);let i=a[0]%tot;for(const v of V){if(i<v.q){x=v;num=v.del+i;break}i-=v.q}if(!usados.has(num))break}
 D.push({num,n:x.n,kid:x.kid,tel:x.tel});setDrawn(D);sorV();const p=$("#pres");p.className="pres good";p.innerHTML=`<small>${D.length}° número</small><b class="big">${n4(num)}</b><span>${esc(x.n)}</span><small>Lo vendió ${esc(x.kid)}</small><small id="wtel" style="display:none">${esc(x.tel)}</small>`;
 const cb=$("#vtel");cb.onchange=()=>{const w=$("#wtel");if(w)w.style.display=cb.checked?"block":"none"};if(navigator.vibrate)navigator.vibrate(80)}
async function cierre(b){if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="¿Seguro? Tocá de nuevo para cerrar";b.classList.add("warn");return}
 b.disabled=true;b.textContent="Cerrando…";const r=await adm("cierre").catch(()=>({ok:false,error:"Sin conexión"}));if(!r.ok){b.disabled=false;b.textContent="🔒 Cerrar la venta";return toast(r.error)}
 await cargarT();toast(`Venta cerrada. ${r.nums} números no vendidos quedaron a nombre de ${r.filas} misioneros.`);sorV()}

/* lista para imprimir */
function imprimir(){const L=T.ventas.slice().sort((a,b)=>a.del-b.del);
 W(`<h1 class="s noprint">LISTA</h1><div class="noprint"><p class="mut">Ordenada por número. ${L.reduce((s,x)=>s+x.q,0)} números en ${L.length} ventas.</p><button class="btn pri" onclick="print()">Imprimir</button></div><table class="plist"><thead><tr><th>Números</th><th>Comprador</th><th>Celular</th><th>Vendió</th></tr></thead><tbody>${L.map(x=>`<tr><td class="nums">${rango(x.del,x.al)}</td><td>${esc(x.n)}</td><td>${esc(x.tel)}</td><td>${esc(x.kid)}</td></tr>`).join("")}</tbody></table><div class="noprint">${back("atab(TAB)")}</div>`)}

const D=[["tree",3,8,120,-12,"d1"],["mate",86,5,100,12,"d2"],["gift",90,28,100,8,"d3"],["star",2,33,90,-8,"d2"],["bell",85,55,100,-10,"d4"],["guitar",3,58,110,10,"d1"],["star",10,84,70,-12,"d3"],["tree",80,84,100,8,"d4"],["ticket",44,91,90,0,"d2"],["star",92,78,60,14,"d1"],["gift",40,-2,90,-8,"d4"],["ticket",70,68,90,20,"d3"]];
$("#deco").innerHTML=D.map(([n,x,y,z,r,c])=>`<svg viewBox="0 0 100 100" style="left:${x}%;top:${y}%;width:${z}px;height:${z}px;transform:rotate(${r}deg);color:var(--${c})"><use href="#${n}"/></svg>`).join("");
function route(){if(location.hash==="#admin")return admin();LOADED?home():start()}
async function start(){if(API.indexOf("__API")===0)return W(`<h1>RIFA${cross}</h1><p>La página todavía no está conectada a la planilla. ¡Ya casi!</p>`);W("<p>Cargando…</p>");if(location.hash==="#admin")return admin();try{await loadData()}catch(e){}home()}
addEventListener("hashchange",route);
start();
</script></body></html>
