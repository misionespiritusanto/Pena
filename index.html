<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:500 17px/1.4 "Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
#deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}#deco svg{position:absolute;opacity:.55}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:26px 14px 36px;text-align:center}
.stamp{background:color-mix(in srgb,var(--card) 93%,transparent);border:3px solid var(--brown);border-radius:26px;box-shadow:6px 6px 0 var(--sh);padding:26px 20px 22px}
button,input{font-family:inherit}
h1{font:800 3.4rem/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--brown);letter-spacing:-.01em;margin:.1em 0 .15em;text-transform:uppercase}

h2{font:800 1.3rem "Bricolage Grotesque",system-ui,sans-serif;margin:.2em 0}
.sub{font-weight:700;letter-spacing:.12em;color:var(--brown);font-size:.85rem}
.where{margin-top:8px}
.when{margin:14px 0;border-top:3px solid var(--brown);border-bottom:3px solid var(--brown);padding:6px;font:800 1.5rem "Bricolage Grotesque",system-ui,sans-serif;color:var(--brown)}
.ico{display:flex;justify-content:center;gap:10px;margin:12px 0}.ico svg{width:50px;height:50px;color:var(--brown)}
.price{font:800 2.8rem/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--acc);margin-top:12px}
.mut{color:var(--mut)}
.btn{display:block;width:100%;margin:11px 0;padding:12px;border-radius:99px;border:2px solid var(--brown);background:var(--sec);color:var(--ink);font:700 1.05rem "Bricolage Grotesque",system-ui,sans-serif;cursor:pointer}
.btn.pri{background:var(--brown);color:var(--btni)}
.btn.o{background:transparent}
.card{background:var(--tint);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:left}
input:not([type=radio]){width:100%;padding:11px 18px;border:2px solid var(--line);border-radius:99px;font:inherit;background:var(--inp);color:var(--ink)}
label{display:block;font-weight:700;margin:12px 0 4px;text-align:left}
.opt{display:flex;align-items:center;gap:10px;margin:10px 0;padding:11px 18px;border-radius:99px;border:2px solid var(--line);cursor:pointer;font-weight:700}
.bar{display:flex;gap:6px;margin:10px 0 16px}.bar i{flex:1;height:6px;border-radius:9px;background:var(--tint)}.bar i.on{background:var(--brown)}
.back{background:none;border:0;color:var(--brown);font:700 1rem "Bricolage Grotesque",system-ui,sans-serif;text-decoration:underline;cursor:pointer;display:block;margin:10px auto 0}
.item{display:block;width:100%;text-align:left;padding:9px 12px;border:0;border-bottom:1px dashed var(--line);background:none;font:inherit;color:inherit;cursor:pointer}
.item small{display:block;color:var(--mut);font-size:.85rem}.item:disabled{opacity:.45;cursor:default}
.prog{height:10px;border-radius:9px;background:var(--tint);overflow:hidden}.prog b{display:block;height:100%;background:var(--brown)}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dotted var(--line)}.row b{color:var(--acc);white-space:nowrap}
.band{border:2px solid var(--brown);background:var(--tint);border-radius:16px;padding:10px 16px;margin:12px 6px;font:800 1.4rem "Bricolage Grotesque",system-ui,sans-serif;color:var(--ink)}
.qr svg{display:block;width:100%;height:auto}
foot{display:block;margin-top:20px;color:var(--mut);font-size:.85rem}foot a{color:inherit}
.band{display:flex;align-items:center;gap:14px;text-align:left}.band span{flex:1}.bi{width:92px;height:92px;border-radius:14px;object-fit:cover;flex:none;border:2px solid var(--brown)}.bi.ph{display:grid;place-items:center;background:var(--tint);border-style:dashed;color:var(--brown)}.bi.ph svg{width:48px;height:48px;opacity:.7}

<script>
/* ===== DATOS EDITABLES (ejemplo basado en la peña del año pasado) ===== */
const CFG={price:10000,per:5,days:3,wa:"5491170544319",date:"Fecha a confirmar",where:"Colegio Marín",cause:"en beneficio del grupo misionero",alias:"[alias a definir]",
desc:"Música, comida, bebidas, postres, baile y mucho más. ¡Hay torneo de truco! Comprale la entrada al chico que quieras."};
const KIDS=["Sofía Ramírez","Mateo Giménez","Valentina Torres","Lucas Fernández","Camila Acosta","Joaquín Sosa","Martina Díaz","Tomás Herrera"];
const BANDS=["Los Rinconeros","Los Parientes","Las Pereyra","Pancho Guevara","¡Y más!"];
const MENU=[["Comida",[["Choripán",5000],["Sándwich de bondiola",7000],["Sándwich de colita",8000],["Porción de tarta",3000],["Porción de torta",3000],["Bolsa de pochoclos",2000]]],["Bebida",[["Vino (vaso)",2000],["Vino (botella)",7000],["Cerveza Andes rubia/roja (lata)",3000],["Agua botella 600cc",2000],["Coca Zero (vaso)",1500],["Coca común (vaso)",1500],["Sprite (vaso)",1500]]],["Combos",[["1 · 2 colitas + gaseosa",15000],["2 · Tarta/torta + gaseosa",4000],["3 · Botella de vino + 2 sándwiches de bondiola",20000],["4 · Tarta + torta",5000],["5 · Pochoclos + bebida",3000]]]];
/* ======================================================================= */
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const money=n=>"$"+n.toLocaleString("es-AR");
let S=[];try{S=JSON.parse(localStorage.getItem("pena")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("pena",JSON.stringify(S))}catch(e){}};
const API="https://script.google.com/macros/s/AKfycbyHwrL31UsxNLst1huri44hHTprQbkNJjTtWNSfmIIcW4B-srRQtbTZmLHPsBEM4eGdvA/exec"; /* pegar acá la URL del script de Google (termina en /exec) */
let AV=null;
const sold=k=>AV?(AV[k]?AV[k].p+AV[k].g:0):S.filter(s=>s.kid===k).reduce((a,s)=>a+s.q,0);
const cupo=k=>AV&&AV[k]?AV[k].c:CFG.per;
const foot=`<foot>Grupo Misionero · Parroquia Espíritu Santo · <a href="#" onclick="priv();return false">Privacidad</a></foot>`;
const W=h=>{app.innerHTML=`<div class="stamp">${h}</div>${foot}`;scrollTo(0,0)};
const cross=`<svg viewBox="0 0 862 1014" fill="#9d171b" aria-hidden="true"><path d="M331 1012C328 1010 324 1009 316 1010C310 1010 309 1010 310 995C310 985 310 981 308 977C307 974 307 970 307 967C308 964 308 955 309 946C310 937 310 927 311 922C311 917 311 910 311 905C311 900 311 894 313 887C314 882 315 872 315 866C316 859 317 850 318 846C318 842 320 828 320 816C321 804 322 790 323 786C324 781 324 768 325 757C326 745 327 730 328 723C329 716 330 705 331 698C331 692 332 684 333 680C334 676 334 664 335 650C336 634 336 627 337 624C338 621 338 619 338 614C337 610 337 607 338 601C339 598 340 588 341 580C341 573 342 562 343 556C346 541 346 510 344 509C343 508 340 508 336 508C333 508 328 508 326 507C313 505 300 503 294 501C291 501 285 499 280 498C276 497 271 495 269 495C263 491 257 489 253 489C249 489 237 486 234 485C232 484 228 483 226 482C224 482 220 481 218 480C216 479 212 478 210 478C207 477 204 476 202 475C201 474 198 473 196 473C194 472 191 471 189 470C188 469 186 468 185 468C184 468 181 467 179 466C176 464 173 463 170 462C168 461 166 460 165 459C164 459 162 458 160 457C159 457 156 456 155 455C154 454 151 452 149 452C147 451 143 449 140 447C138 445 134 444 133 443C132 442 129 441 128 439C126 438 124 437 124 437C123 437 122 436 120 435C115 431 109 427 107 427C106 427 97 422 94 419C92 418 89 415 86 412C83 410 80 408 80 407C80 407 74 402 68 396C61 390 55 385 54 383C53 382 49 378 46 375C43 371 40 368 40 368C40 366 35 358 30 353C24 346 20 340 20 338C20 337 19 335 18 333C16 331 15 329 15 328C15 326 14 323 13 321C11 319 10 315 10 313C9 311 8 307 7 305C6 302 5 298 4 295C4 293 3 289 2 286C-6 269 15 257 32 269C34 270 36 271 37 271C38 271 39 272 40 272C41 273 43 275 46 275C48 276 51 278 52 278C53 279 55 280 57 281C59 282 61 283 62 284C63 284 65 285 67 286C68 286 70 287 71 288C72 288 74 289 76 290C79 291 82 292 83 293C84 294 87 295 89 296C91 296 94 297 95 298C97 299 99 300 102 301C104 302 106 302 107 303C107 304 109 305 112 305C115 306 120 309 124 310C137 317 139 318 146 319C150 319 156 319 158 320C161 320 166 321 169 321C172 321 176 322 179 323C182 324 187 325 191 326C194 326 198 328 200 328C202 329 206 330 209 331C212 331 217 332 220 333C224 334 231 335 235 336C240 337 245 337 246 338C248 339 263 341 270 341C273 341 279 342 284 343C288 344 296 345 300 346C305 346 313 347 318 348C328 350 344 352 345 351C347 350 345 303 343 290C341 281 341 272 341 233C340 181 339 152 337 142C337 138 336 127 335 118C333 84 332 66 331 54C330 42 331 33 333 29C334 28 335 25 336 24C337 19 352 4 357 4C357 4 359 3 362 2C366 -0 371 -1 375 1C380 4 383 4 386 2C390 1 397 1 404 3C407 3 418 4 428 4C440 5 454 6 461 6C472 7 474 7 479 6C494 1 515 11 523 27C526 34 526 34 526 56C526 86 524 136 522 150C520 168 520 178 521 185C524 193 522 251 519 261C518 266 518 276 517 301C517 322 516 336 515 339C513 347 514 347 530 346C538 346 548 344 554 343C559 342 570 341 577 340C585 340 592 339 594 338C596 337 602 336 607 336C612 336 619 334 622 333C630 331 639 330 647 330C651 330 654 329 657 328C663 325 670 323 680 321C685 321 692 319 695 318C698 317 701 316 702 316C704 316 707 315 709 314C711 312 715 311 718 311C720 310 724 309 726 308C728 307 730 306 731 306C732 306 736 305 739 304C742 303 747 301 749 301C751 300 756 299 758 298C760 297 764 296 767 295C769 294 771 294 771 293C771 291 779 287 783 287C786 286 790 285 794 283C797 281 800 280 801 280C802 280 804 279 806 278C807 277 810 276 812 276C813 275 815 274 816 273C817 273 819 272 821 271C824 270 826 269 828 268C829 267 831 266 833 266C834 265 836 264 837 263C838 262 850 261 851 263C852 263 851 265 849 266C846 268 847 270 851 270C854 270 858 274 858 277C858 278 859 282 860 286C862 292 862 292 860 296C859 298 858 301 858 303C857 305 856 307 856 308C855 309 854 310 853 312C853 315 843 336 841 338C840 339 838 341 838 343C836 347 828 358 825 361C825 362 823 365 823 366C822 368 821 371 819 372C818 374 817 376 817 376C817 377 816 377 815 378C812 378 812 378 802 390C799 395 795 398 795 398C794 398 794 399 793 400C793 402 773 419 765 425C763 426 759 429 758 430C751 435 739 442 737 443C735 443 734 444 733 445C732 445 730 446 728 447C726 448 724 449 722 450C721 451 719 452 718 453C717 453 714 454 713 455C712 456 710 457 709 457C708 457 706 458 703 459C693 465 688 467 685 467C682 468 680 469 679 470C677 470 674 472 672 472C665 475 655 479 653 481C652 481 649 482 646 483C640 484 627 488 621 490C615 492 612 492 607 491C601 488 596 489 599 492C602 496 596 497 588 495C579 491 566 493 574 497C582 501 571 504 560 501C555 499 544 498 542 500C541 501 541 501 543 501C548 501 551 503 549 505C546 508 543 507 538 505C527 499 506 505 508 513C508 516 511 517 512 514C515 507 517 531 515 542C514 546 514 549 515 552C516 555 516 560 513 586C513 597 515 602 517 594C519 583 521 598 519 612C518 617 518 621 518 623C519 625 519 628 519 629C519 631 520 633 521 634C523 637 523 637 521 640C517 644 517 649 520 654C522 657 522 659 522 662C521 669 523 694 525 699C525 701 527 708 527 713C528 718 529 723 529 725C532 729 531 735 529 738C527 739 527 740 527 754C528 773 529 775 532 778C534 780 534 780 533 783C531 788 533 835 535 846C536 847 536 859 537 872C538 890 538 896 539 899C540 901 541 905 541 908C541 915 543 964 543 966C544 970 547 995 547 999C547 1002 548 1004 549 1005C552 1007 551 1009 548 1010C544 1011 421 1011 417 1010C415 1009 412 1010 409 1011C406 1011 402 1012 397 1011C377 1010 343 1011 340 1012C336 1014 335 1014 331 1012Z"/></svg>`;
const qr=t=>{try{const q=qrcode(0,"M");q.addData(t);q.make();return q.createSvgTag({scalable:true,cellSize:4,margin:0})}catch(e){return ""}};
const back=f=>`<button class="back" onclick="${f}">‹ Volver</button>`;
function home(){W(`<h1>PEÑA${cross}</h1><div class="sub">PARROQUIA ESPÍRITU SANTO</div><div class="where">📍 ${CFG.where}</div><div class="when">${CFG.date}</div><div class="ico">${["guitar","mate","flag","poncho","bombo"].map(n=>`<svg viewBox="0 0 100 100"><use href="#${n}"/></svg>`).join("")}</div><p>${CFG.desc}</p><div class="price">${money(CFG.price)}</div><div class="mut">cada entrada · ${CFG.cause}</div><button class="btn pri" onclick="buy(1)">Comprar entradas</button><button class="btn" onclick="mi()">Ver mi entrada</button><button class="btn" onclick="bands()">Ver bandas</button><button class="btn" onclick="menu()">Ver menú</button><button class="btn o" onclick="mine()">Ver cuántas vendí</button>${wa("Hola, tengo una consulta sobre la peña.")}`)}
const BAND_IMG={}; /* "Nombre de la banda":"foto.jpg" o imagen incrustada (data:image/...) */
const bimg=b=>b.startsWith("¡Y más")?"":BAND_IMG[b]?`<img class="bi" src="${esc(BAND_IMG[b])}" alt="${esc(b)}">`:`<div class="bi ph"><svg viewBox="0 0 100 100"><use href="#note"/></svg></div>`;
function bands(){W(`<h1 class="s">BANDAS</h1><div class="sub">${CFG.date}</div><div style="margin-top:14px">${BANDS.map((b,i)=>`<div class="band" style="flex-direction:${i%2?"row-reverse":"row"}">${bimg(b)}<span>${b}</span></div>`).join("")}</div><p class="mut">¡Hay torneo de truco!</p>${back("home()")}`)}
function menu(){W(`<h1 class="s">MENÚ</h1><div style="margin-top:12px">${MENU.map(([t,r])=>`<div class="card" style="margin-bottom:14px"><h2>${t.toUpperCase()}</h2>${r.map(([n,p])=>`<div class="row"><span>${n}</span><b>${money(p)}</b></div>`).join("")}</div>`).join("")}</div>${back("home()")}`)}
function list(q,fn,dis){const k=norm(q);return KIDS.map((x,i)=>[x,i]).filter(([x])=>norm(x).includes(k)).slice(0,8).map(([x,i])=>{const r=cupo(x)-sold(x);return `<button class="item" ${dis&&!r?"disabled":""} onclick="${fn}(${i})">${esc(x)}${dis?`<small>${r?r+" disponibles":"Agotadas"}</small>`:""}</button>`}).join("")||"<p>No encontramos ese nombre.</p>"}
let F={};
function flt(){$("#l").innerHTML=list($("#s").value,"pick",1)}
function pick(i){F.kid=KIDS[i];F.q=1;buy(2)}
function qd(d,r){F.q=Math.min(r,Math.max(1,F.q+d));$("#q").textContent=F.q;$("#tt").textContent=money(F.q*CFG.price)}
function buy(n){
if(n==1)F={kid:"",q:1,name:"",tel:"",mail:"",g:[],pay:""};
const bar=`<div class="bar">${[1,2,3,4].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div>`;
const sub=`<p class="mut">Le estás comprando a ${esc(F.kid)}</p>`;let h="";
if(n==1)h=`<h2>¿A quién le vas a comprar?</h2><label>Nombre</label><input id="s" placeholder="Buscá el nombre" oninput="flt()"><div id="l" style="margin-top:10px"></div>`;
if(n==2){const r=cupo(F.kid)-sold(F.kid);h=`<h2>¿Cuántas entradas?</h2>${sub}<p>Quedan ${r} disponibles.</p><div style="display:flex;align-items:center;justify-content:center;gap:24px;margin:12px"><button class="btn o" style="width:60px;margin:0;padding:6px" onclick="qd(-1,${r})">−</button><b id="q" style="font-size:3rem">${F.q}</b><button class="btn o" style="width:60px;margin:0;padding:6px" onclick="qd(1,${r})">+</button></div><p>Total: <b id="tt">${money(F.q*CFG.price)}</b></p><button class="btn pri" onclick="buy(3)">Continuar</button>`}
if(n==3)h=`<h2>Tus datos</h2>${sub}<label>Nombre</label><input id="n" value="${esc(F.name)}"><label>Teléfono</label><input id="t" type="tel" value="${esc(F.tel)}"><label>Mail</label><input id="m" type="email" value="${esc(F.mail)}">${Array.from({length:F.q-1},(_,i)=>`<label>Nombre del invitado ${i+2}</label><input class="gi" value="${esc(F.g[i]||"")}">`).join("")}<p id="err" style="color:var(--coral)"></p><button class="btn pri" onclick="s3()">Continuar</button>`;
if(n==4)h=`<h2>Medio de pago</h2>${sub}<p>Total a pagar: <b>${money(F.q*CFG.price)}</b></p>${["Transferencia","Efectivo"].map(v=>`<label class="opt"><input type="radio" name="p" value="${v}" ${F.pay==v?"checked":""}> ${v}</label>`).join("")}<p id="err" style="color:var(--coral)"></p><button class="btn pri" onclick="done()">Registrar compra</button>`;
W(`${bar}${h}${back(n>1?"buy("+(n-1)+")":"home()")}`);if(n==1)flt()}
function s3(){F.name=$("#n").value.trim();F.tel=$("#t").value.trim();F.mail=$("#m").value.trim();F.g=[...document.querySelectorAll(".gi")].map(e=>e.value.trim());
if(!F.name||F.tel.replace(/\D/g,"").length<8||!/.+@.+\..+/.test(F.mail)||F.g.some(x=>!x))return $("#err").textContent="Completá nombre, teléfono, mail y el nombre de cada invitado.";buy(4)}
async function done(){const p=document.querySelector("input[name=p]:checked");if(!p)return $("#err").textContent="Elegí un medio de pago.";

F.pay=p.value;if(API)return send();const code=Math.random().toString(36).slice(2,7).toUpperCase(),tot=money(F.q*CFG.price);
S.push({kid:F.kid,q:F.q,name:F.name,tel:F.tel,mail:F.mail,pay:F.pay,g:F.g,code,at:Date.now()});save();

let P=[];
function mine(){W(`<h1 class="s">¿CUÁNTAS VENDÍ?</h1><label>Nombre</label><input id="s" placeholder="Buscá el nombre" oninput="mf()"><div id="l"></div><div id="c"></div>${back("home()")}`);mc()}
function mf(){$("#l").innerHTML=$("#s").value.trim()?list($("#s").value,"mp",0):""}
function mp(i){if(!P.includes(i))P.push(i);$("#s").value="";mf();mc()}
function mc(){$("#c").innerHTML=P.map(i=>{const k=KIDS[i],s=sold(k),t=cupo(k);return `<div class="card" style="margin-top:14px;position:relative"><button class="back" style="position:absolute;right:12px;top:0;text-decoration:none;font-size:1.6rem" onclick="P=P.filter(x=>x!=${i});mc()">×</button><b>${esc(k)}</b><div style="margin:8px 0"><b style="font-size:2.2rem">${s}</b> de ${t} vendidas</div><div style="margin-bottom:8px"><b>${money(s*CFG.price)}</b> de ${money(t*CFG.price)} recaudados</div><div class="prog"><b style="width:${Math.min(100,s/t*100)}%"></b></div>${s>=t?"<p>¡Vendiste todas! 🎉</p>":""}</div>`}).join("")}
function policy(){W(`<h1 class="s">Política de privacidad</h1><p class="mut">Última actualización: 24 de octubre de 2026</p><div class="card"><p><b>Quién:</b> la peña la organiza el Grupo Misionero de la Parroquia Espíritu Santo.</p><p><b>Qué datos guardamos:</b> al comprar, tu nombre, teléfono y mail, el nombre de cada asistente, a qué chico le compraste, la cantidad y el medio y estado de pago. No pedimos DNI, domicilio ni datos bancarios.</p><p><b>Para qué:</b> confirmar tu pago, enviarte las entradas y armar la lista de ingreso. No los usamos para otra cosa ni los compartimos con nadie.</p><p><b>Quién los ve:</b> solo el Grupo Misionero. Los chicos que venden ven únicamente cantidades, nunca quién compró. En la puerta solo se ve el nombre y si la entrada es válida. Quien tenga el link de tus entradas puede verlas.</p><p><b>Los chicos que venden:</b> solo se muestran su nombre y su grupo.</p><p><b>Tecnología:</b> usamos Google (Sheets y Gmail) para guardar las compras y mandar los mails. No usamos publicidad, estadísticas ni cookies de seguimiento. Tu navegador guarda el código de tus compras para mostrarte tus entradas.</p><p><b>Tus derechos:</b> podés pedir ver, corregir o borrar tus datos cuando quieras escribiendo a ignaciozavalia1@gmail.com (Ley 25.326 de Protección de Datos Personales; la AAIP es el órgano de control).</p></div>${back("home()")}`)}
function priv(){W(`<h1 class="s">PRIVACIDAD</h1><div class="card"><p>La peña la organiza el <b>Grupo Misionero de la Parroquia Espíritu Santo</b>, en beneficio del grupo misionero.</p><p><b>Qué datos pedimos:</b> nombre, teléfono y mail de quien compra, y el nombre de cada asistente. Los usamos solo para registrar tu compra, confirmar el pago, avisarte y armar la lista de ingreso.</p><p><b>Quién los ve:</b> las personas del Grupo Misionero a cargo de las entradas y de la puerta. Los chicos que venden ven únicamente cuántas entradas vendieron. De ellos se muestra solo el nombre.</p><p>No usamos publicidad ni cookies de seguimiento, y no compartimos tus datos con terceros, salvo los servicios que usamos para guardarlos y mandar mails (Google).</p><p><b>Tus derechos:</b> podés pedir ver, corregir o borrar tus datos escribiendo a <b>ignaciozavalia1@gmail.com</b> (Ley 25.326).</p><p>Para dudas o problemas con tu compra, escribinos por WhatsApp al <b>${fmtTel(CFG.wa)}</b>.</p></div>${back("home()")}`)}

async function send(){const b=$(".btn.pri");b.disabled=true;b.textContent="Registrando…";const bad=m=>{b.disabled=false;b.textContent="Registrar compra";$("#err").textContent=m};

function reserva(code){const tot=money(F.q*CFG.price);W(`<h1 class="s">¡RESERVADO!</h1><div class="card"><p>Reservamos <b>${F.q}</b> ${F.q>1?"entradas":"entrada"} a nombre de ${esc(F.name)} (a ${esc(F.kid)}). <b>Todavía falta el pago</b>: tu entrada con QR se habilita cuando lo confirmemos.</p>${F.pay=="Transferencia"?payBox(F.q*CFG.price):`<p>Pagá ${tot} en efectivo a ${esc(F.kid)} antes de la peña y decile el código <b>${code}</b>.</p>`}<p class="mut">Tu código de reserva es <b>${code}</b>. Cuando confirmemos el pago, entrá a “Ver mi entrada” con ese código y tu mail para ver tus entradas con QR. Si no se paga en ${CFG.days} días, la reserva se libera.</p></div>${wa("Hola, tengo una duda con mi reserva "+code)}<button class="btn pri" onclick="home()">Volver al inicio</button>`)}

KIDS.length=0;AV={};d.chicos.forEach(x=>{KIDS.push(x.n);AV[x.n]={c:Number(x.cupo),p:Number(x.p),g:Number(x.g)}});

const f=c["Fuente (nombre de Google Fonts)"];if(f&&f!=="Bricolage Grotesque"){const l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family="+encodeURIComponent(f).replace(/%20/g,"+")+":wght@400;500;700;800&display=swap";document.head.appendChild(l);const st=document.createElement("style");st.textContent='*{font-family:"'+String(f).replace(/"/g,"")+'",system-ui,sans-serif !important}';document.head.appendChild(st)}

function mi(pre){W(`<h1 class="s">MI ENTRADA</h1><p class="mut">Ingresá el código de tu reserva y el mail con el que compraste.</p><label>Código</label><input id="mc" placeholder="Ej: AB12C" value="${esc(pre||"")}" autocapitalize="characters"><label>Mail</label><input id="mm" type="email"><p id="err" style="color:var(--coral)"></p><button class="btn pri" onclick="mq()">Ver mis entradas</button>${back("home()")}`)}
async function mq(){const c=$("#mc").value.trim().toUpperCase().replace(/^PENA-/,"").split("-")[0],m=$("#mm").value.trim();if(!c||!m)return $("#err").textContent="Completá el código y el mail.";

const l=S.filter(x=>x.code===c&&x.mail.toLowerCase()===m.toLowerCase());if(!l.length)return $("#err").textContent="No encontramos una reserva con ese código y ese mail. (Demo: probá el código DEMO1)";

try{const r=await(await fetch(API+"?action=entrada&code="+encodeURIComponent(c)+"&mail="+encodeURIComponent(m))).json();if(!r.ok)return $("#err").textContent=r.error||"No encontramos esa reserva.";ver(r)}catch(e){$("#err").textContent="No pudimos conectar. Probá de nuevo."}}
function ver(r){const it=r.items,tk=it.filter(x=>x.e==="Pagada"),pe=it.filter(x=>x.e==="Pendiente"),an=it.filter(x=>x.e==="Anulada");
