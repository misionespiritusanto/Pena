/* ---------- fotos flotando (solo en la portada) ---------- */
function flot(on){const L=$("#flot");if(!on||!FLOT.length){L.innerHTML="";L.dataset.on="";return}if(L.dataset.on)return;L.dataset.on="1";
 const n=Math.min(FLOT.length,innerWidth<700?5:9),pos=[[2,6],[78,4],[6,40],[84,34],[3,74],[80,68],[88,90],[60,14],[22,20]];
 L.innerHTML=FLOT.slice(0,n).map((f,i)=>{const [x,y]=pos[i%pos.length],r=(i%2?1:-1)*(4+i%3*3),d=18+i%4*5;return `<figure class="pol" style="left:${x}%;top:${y}%;--r:${r}deg;animation-duration:${d}s;animation-delay:-${i*3}s"><img src="${esc(f)}" alt="" loading="lazy"></figure>`}).join("")}

/* ---------- portada ---------- */
function home(){if(!LOADED)return W(`<h1>PEÑA${cross}</h1><p>No pudimos cargar los datos. Revisá tu internet.</p><button class="btn pri" onclick="start()">Reintentar</button>${wa()}`);
 if(ME&&!KIDS.includes(ME)){ME="";store.set("pena_yo","")}
 W(`<h1>PEÑA${cross}</h1><div class="sub">GRUPO MISIONERO · PARROQUIA ESPÍRITU SANTO</div>${CFG.where?`<div class="where">📍 ${esc(CFG.where)}</div>`:""}${CFG.date?`<div class="when">${esc(CFG.date)}</div>`:""}<div class="ico">${["guitar","mate","flag","poncho","bombo"].map(ico).join("")}</div>
 <p><b>Página para misioneros.</b> Cargá acá el nombre y apellido de cada persona que te compró una entrada: esa es la lista con la que se entra a la peña.</p><div class="price">${money(CFG.price)}</div><div class="mut">cada entrada · ${CFG.per} por misionero</div>
 ${ME?`<button class="btn pri" onclick="yo()">Mis entradas · ${esc(ME)}</button><button class="btn" onclick="como()">¿Cómo funciona?</button><button class="back" onclick="cambiar()">No soy ${esc(first(ME))}</button>`:`<button class="btn pri" onclick="elegir()">Soy misionero: cargar mis entradas</button><button class="btn" onclick="como()">¿Cómo funciona?</button>`}${wa()}`,true)}

function como(){W(`<h1 class="s">¿CÓMO FUNCIONA?</h1><div class="card"><p><b>1. Vendés tus ${CFG.per} entradas</b> a ${money(CFG.price)} cada una y cobrás vos la plata.</p><p><b>2. Cargás a cada persona acá:</b> nombre y apellido de quien va a ir a la peña (una persona por entrada).</p><p><b>3. Entregás la plata</b> a los coordinadores. ${esc(CFG.pagoTxt)}</p><p><b>4. El día de la peña</b> no hace falta entrada ni QR: en la puerta buscan el nombre en la lista. Avisale a cada uno que vaya con el nombre que cargaste.</p></div><div class="card" style="margin-top:12px"><p style="margin:0">Las ${CFG.per} entradas se pagan aunque no las vendas. Si vendiste más de ${CFG.per}, primero fijate si a otro misionero le quedan lugares; si no, pedile a un coordinador que te suba el cupo.</p></div>${ME?`<button class="btn pri" onclick="yo()">Ir a mis entradas</button>`:`<button class="btn pri" onclick="elegir()">Cargar mis entradas</button>`}${back("home()")}`)}
function priv(){W(`<h1 class="s">PRIVACIDAD</h1><div class="card"><p>La peña la organiza el <b>Grupo Misionero de la Parroquia Espíritu Santo</b>.</p><p><b>Qué datos guardamos:</b> el nombre y apellido de cada persona que compró una entrada, el misionero que se la vendió y, si lo cargan, un teléfono. Los usamos solo para armar la lista de ingreso a la peña.</p><p><b>Quién los ve:</b> los coordinadores del Grupo Misionero. Cada misionero ve solo las personas que cargó.</p><p>No usamos publicidad ni cookies de seguimiento, y no compartimos los datos con terceros, salvo los servicios de Google donde se guardan.</p><p><b>Tus derechos:</b> podés pedir ver, corregir o borrar tus datos escribiendo a <b>${esc(CFG.mail)}</b> (Ley 25.326).</p></div>${back("home()")}`)}

/* ---------- elegir misionero ---------- */
function elegir(){W(`<h1 class="s">¿QUIÉN SOS?</h1><p class="mut">Buscá tu nombre como figura en la lista de la misión.</p><label>Tu nombre</label><input id="s" placeholder="Escribí tu nombre o apellido" oninput="flt()" autocomplete="off"><div id="l" style="margin-top:10px"></div>${back("home()")}`);$("#s").focus()}
function flt(){const q=$("#s").value;if(!q.trim())return $("#l").innerHTML="";const ws=words(q),L=KIDS.filter(x=>matches(x,ws));
 $("#l").innerHTML=L.slice(0,8).map(x=>{const a=AV[x];return `<button class="item" onclick="soy(${KIDS.indexOf(x)})">${esc(x)}<small>${a.k} de ${a.c} cargadas</small></button>`}).join("")+(L.length>8?`<p class="mut" style="font-size:.9rem">Hay más: escribí alguna letra más.</p>`:"")||`<p>No encontramos ese nombre.</p><p class="mut" style="font-size:.9rem">Probá con tu apellido. Si no aparecés, avisale a un coordinador.</p>`}
function soy(i){ME=KIDS[i];store.set("pena_yo",ME);if(CFG.clave&&!MK)return claveV();yo()}
function cambiar(){ME="";store.set("pena_yo","");elegir()}
function claveV(err){W(`<h1 class="s">CLAVE</h1><p>Hola <b>${esc(first(ME))}</b>. Poné la clave de misioneros (la pasaron por el grupo).</p><input id="k" type="password" autocomplete="off" onkeydown="if(event.key==='Enter')clOk()"><p id="err" class="err">${esc(err||"")}</p><button class="btn pri" onclick="clOk()">Entrar</button>${back("cambiar()")}`);$("#k").focus()}
function clOk(){MK=$("#k").value.trim();if(!MK)return $("#err").textContent="Escribí la clave.";store.set("pena_clave",MK);yo()}

/* ---------- mis entradas ---------- */
let R=null;
async function yo(){if(!ME)return elegir();W(`<h1 class="s">MIS ENTRADAS</h1><p class="mut">Cargando…</p>`);
 let r;try{r=await post({action:"mis",kid:ME,clave:MK})}catch(e){return W(`<h1 class="s">MIS ENTRADAS</h1><p>No pudimos conectar. Revisá tu internet.</p><button class="btn pri" onclick="yo()">Reintentar</button>${back("home()")}`)}
 if(!r.ok){if(r.clave){const had=MK;MK="";store.set("pena_clave","");return claveV(had?r.error:"")}return W(`<h1 class="s">MIS ENTRADAS</h1><p class="err">${esc(r.error)}</p><button class="btn pri" onclick="cambiar()">Buscar mi nombre de nuevo</button>${back("home()")}`)}
 mio(r)}
function mio(r,msg){R=r;if(AV[r.kid])AV[r.kid].k=r.items.length;const n=r.items.length,c=r.cupo,falta=Math.max(0,r.debe-r.pagado);
 W(`<h1 class="s">MIS ENTRADAS</h1><div class="sub">${esc(r.kid.toUpperCase())}</div>
 <div class="card" style="margin-top:14px"><div style="text-align:center"><b style="font-size:2.4rem">${n}</b> de ${c} cargadas</div><div class="prog" style="margin:8px 0 4px"><b style="width:${Math.min(100,n/c*100)}%"></b></div>
 ${n?r.items.map((x,i)=>`<div class="row" style="align-items:center"><span>${i+1}. ${esc(x.n)}${x.tel?`<small class="mut" style="display:block;font-size:.85rem">${esc(x.tel)}</small>`:""}</span>${x.ing?`<span class="tag t-Pagada">Entró ${esc(x.ing)}</span>`:`<button class="chip" style="flex:none" onclick="borrar('${esc(x.id)}',this)">Borrar</button>`}</div>`).join(""):`<p class="mut" style="text-align:center;margin:8px 0 0">Todavía no cargaste a nadie.</p>`}</div>
 ${msg?`<div class="card ok">${msg}</div>`:""}
 ${n<c?`<h2 style="margin-top:18px">Cargar una persona</h2><label>Nombre y apellido <span class="mut" style="font-weight:500">(de quien va a la peña)</span></label><input id="n" autocomplete="off" autocapitalize="words" onkeydown="if(event.key==='Enter')$('#t').focus()"><label>Teléfono <span class="mut" style="font-weight:500">(opcional)</span></label><input id="t" type="tel" autocomplete="off" onkeydown="if(event.key==='Enter')cargar()"><div id="err"></div><button class="btn pri" onclick="cargar()">Cargar entrada</button><p class="mut" style="font-size:.88rem">Te ${c-n===1?"queda":"quedan"} ${c-n} por cargar.</p>`:`<div class="card" style="margin-top:12px"><p style="margin:0"><b>¡Cargaste tus ${c} entradas! 🎉</b> Si vendiste más, primero fijate si a otro misionero le quedan lugares; si no, pedile a un coordinador que te suba el cupo.</p></div>`}
 <div class="card" style="margin-top:14px"><h2>Plata</h2><div class="row"><span>Tenés que entregar</span><b>${money(r.debe)}</b></div><div class="row"><span>Entregaste</span><b>${money(r.pagado)}</b></div>${falta?`<div class="row"><span>Te falta entregar</span><b>${money(falta)}</b></div>`:`<p style="margin:8px 0 0">✅ Estás al día. ¡Gracias!</p>`}<p class="mut" style="font-size:.88rem;margin-bottom:0">${Math.max(c,n)} × ${money(r.price)}. Las ${c} entradas se pagan aunque no las vendas. ${esc(r.pagoTxt||"")}</p></div>
 ${wa()}<button class="back" onclick="home()">‹ Inicio</button><button class="back" onclick="cambiar()">No soy ${esc(first(r.kid))}</button>`);
 if(n<c&&msg)$("#n").focus()}
async function cargar(force){const name=$("#n").value.replace(/\s+/g," ").trim(),tel=$("#t").value.trim(),e=$("#err");
 if(!/\S{2,}\s+\S{2,}/.test(name))return e.innerHTML=`<p class="err">Escribí nombre y apellido de la persona.</p>`;
 if(tel&&tel.replace(/\D/g,"").length<8)return e.innerHTML=`<p class="err">El teléfono parece incompleto (o dejalo vacío).</p>`;
 const b=$(".btn.pri");b.disabled=true;b.textContent="Cargando…";
 try{const r=await post({action:"cargar",kid:ME,clave:MK,name,tel,force:!!force});
  if(r.ok)return mio(r,`✔ Cargaste a <b>${esc(name)}</b>.`);
  b.disabled=false;b.textContent="Cargar entrada";
  if(r.dup)return e.innerHTML=`<div class="card" style="margin:10px 0"><p style="margin-top:0">Ya hay un <b>“${esc(r.dup.n)}”</b> en la lista (lo cargó ${r.dup.kid==="vos"?"<b>vos</b>":"<b>"+esc(r.dup.kid)+"</b>"}). ¿Es otra persona?</p><div class="acts"><button class="btn pri" onclick="cargar(true)">Sí, es otra persona</button><button class="btn o" onclick="$('#err').innerHTML='';$('#n').focus()">No, cancelar</button></div></div>`;
  if(r.clave){MK="";store.set("pena_clave","");return claveV(r.error)}
  e.innerHTML=`<p class="err">${esc(r.error||"No se pudo cargar.")}</p>`}catch(x){b.disabled=false;b.textContent="Cargar entrada";e.innerHTML=`<p class="err">No pudimos conectar. Revisá tu internet y probá de nuevo.</p>`}}
async function borrar(id,b){if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="¿Seguro? Tocá de nuevo";b.classList.add("warn");return}
 b.disabled=true;b.textContent="Borrando…";try{const r=await post({action:"borrar",kid:ME,clave:MK,id});if(!r.ok){b.disabled=false;b.textContent="Borrar";return toast(r.error)}mio(r,"Listo, la borramos.")}catch(e){b.disabled=false;b.textContent="Borrar";toast("No pudimos conectar.")}}

/* ---------- administración (#admin) ---------- */
let K="";try{K=localStorage.getItem("pk")||sessionStorage.getItem("pk")||""}catch(e){}
const adm=(op,o)=>post(Object.assign({action:"admin",clave:K,op},o||{}));
let T=null,TAB="puerta",AUTO=null,MX=-1,MF="todos";
function stopAuto(){if(AUTO){clearInterval(AUTO);AUTO=null}}
function admin(){if(!K)return W(`<h1 class="s">ADMIN</h1><label>Clave</label><input id="ak" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')alog()"><label class="opt"><input type="checkbox" id="arec"> <span>Recordar en este celular<small>Para los celulares de la puerta</small></span></label><p id="err" class="err"></p><button class="btn pri" onclick="alog()">Entrar</button>${back("salirAdmin()")}`);atab(TAB)}
async function alog(){const b=$(".btn.pri");b.disabled=true;K=$("#ak").value;const r=await adm("login").catch(()=>({ok:false,error:"Sin conexión"}));b.disabled=false;if(!r.ok){K="";return $("#err").textContent=r.error}try{($("#arec")&&$("#arec").checked?localStorage:sessionStorage).setItem("pk",K)}catch(e){}atab("puerta")}
function salirAdmin(){K="";T=null;try{sessionStorage.removeItem("pk");localStorage.removeItem("pk")}catch(e){}location.hash="";start()}
async function cargarT(){const r=await adm("todo").catch(()=>({ok:false,error:"Sin conexión"}));if(r.ok){T=r;T.at=Date.now()}else if(/Clave/.test(r.error||"")){K="";try{sessionStorage.removeItem("pk");localStorage.removeItem("pk")}catch(e){}}return r}
async function atab(t){TAB=t;const tabs=[["puerta","Puerta"],["misioneros","Misioneros"],["resumen","Resumen"]];
 W(`<h1 class="s">ADMIN</h1><div class="tabs">${tabs.map(([k,n])=>`<button class="${k===t?"on":""}" onclick="atab('${k}')">${n}</button>`).join("")}</div><div id="ab"><p class="mut">Cargando…</p></div><button class="back" onclick="salirAdmin()">Salir</button>`);
 if(!T||Date.now()-T.at>15000){const r=await cargarT();if(!r.ok){if(!K)return admin();return $("#ab").innerHTML=`<p class="err">${esc(r.error)}</p><button class="btn" onclick="atab('${t}')">Reintentar</button>`}}
 if(TAB!==t||!$("#ab"))return;if(t==="puerta")puerta();if(t==="misioneros")misV();if(t==="resumen")resV()}

/* puerta: buscar el nombre y marcar que entró */
function puerta(){const L=T.lista,e=L.filter(x=>x.ing).length;
 $("#ab").innerHTML=`<div id="pres" class="pres"><span>Entraron <b id="pe">${e}</b> de <b id="pt">${L.length}</b></span><small>Buscá a la persona por nombre o apellido</small></div><input id="pq" placeholder="Nombre o apellido" autocomplete="off" oninput="pf()" style="margin-top:12px;font-size:1.15rem"><div id="pr"></div><button class="btn o" onclick="imprimir()">🖨 Lista impresa de respaldo</button>`;
 $("#pq").focus();AUTO=setInterval(async()=>{if(TAB!=="puerta"||!$("#pq"))return stopAuto();const r=await cargarT();if(r.ok&&$("#pq")){$("#pe").textContent=T.lista.filter(x=>x.ing).length;$("#pt").textContent=T.lista.length;if(!document.querySelector("#pr button:disabled"))pf(true)}},20000)}
function pf(keep){const q=$("#pq").value,ws=words(q),pr=$("#pr");if(!keep&&$("#pres").dataset.r){$("#pres").className="pres";$("#pres").dataset.r=""}
 if(norm(q).length<2)return pr.innerHTML=`<p class="mut" style="font-size:.9rem">Escribí al menos 2 letras.</p>`;
 const L=T.lista.filter(x=>matches(x.n,ws)).sort((a,b)=>(a.ing?1:0)-(b.ing?1:0)||a.n.localeCompare(b.n,"es"));
 pr.innerHTML=L.slice(0,25).map(x=>`<div class="card ac"><div class="ach"><b>${esc(x.n)}</b>${x.ing?`<span class="tag t-Pagada">Entró ${esc(x.ing)}</span>`:""}</div><div class="mut" style="font-size:.9rem">${x.kid===T.puerta?"Vendida en la puerta":"Vendió: "+esc(x.kid)}</div><div class="acts">${x.ing?`<button class="btn o" onclick="ping('${x.id}',1,this)">Deshacer ingreso</button>`:`<button class="btn pri" onclick="ping('${x.id}',0,this)">✔ Entró</button>`}</div></div>`).join("")+(L.length>25?`<p class="mut">Hay más: escribí más letras.</p>`:"")
  +(L.length?"":`<div class="card" style="margin-top:10px"><p style="margin-top:0"><b>No está en la lista.</b> Probá con el apellido o fijate a quién le compró.</p><label style="margin-top:0">Si paga la entrada acá (${money(T.price)}):</label><input id="vn" value="${esc(q.trim())}" placeholder="Nombre y apellido"><button class="btn" onclick="vender(this)">Cobrar ${money(T.price)} y dejarlo pasar</button></div>`)}
function pres(cls,a,b){const p=$("#pres");p.className="pres "+cls;p.dataset.r="1";p.innerHTML=`<b>${a}</b><span>${esc(b)}</span><small>Entraron ${T.lista.filter(x=>x.ing).length} de ${T.lista.length}</small>`;if(navigator.vibrate)navigator.vibrate(cls==="good"?80:[60,60,60])}
async function ping(id,undo,b){b.disabled=true;const x=T.lista.find(y=>y.id===id);const r=await adm("ingreso",{id,undo:!!undo}).catch(()=>({ok:false,error:"Sin conexión: anotalo en la lista impresa."}));
 if(r.ok){x.ing=r.ing;if(undo){b.disabled=false;pres("","Ingreso deshecho",x.n);return pf(true)}pres("good","✔ PUEDE PASAR",x.n);$("#pq").value="";$("#pr").innerHTML="";$("#pq").focus();return}
 b.disabled=false;if(r.ya){x.ing=r.ya;pres("warn","⚠ YA ENTRÓ a las "+r.ya,x.n);return pf(true)}pres("bad","✖ "+(r.error||"Error"),x?x.n:"")}
async function vender(b){const n=$("#vn").value.replace(/\s+/g," ").trim();if(n.length<3)return toast("Escribí el nombre.");b.disabled=true;b.textContent="Registrando…";
 const r=await adm("puerta",{name:n}).catch(()=>({ok:false,error:"Sin conexión"}));if(!r.ok){b.disabled=false;b.textContent="Cobrar y dejarlo pasar";return toast(r.error)}
 T.lista.push({id:r.id,f:"",kid:T.puerta,n,tel:"",ing:r.ing});pres("good","✔ PUEDE PASAR · cobrá "+money(T.price),n);$("#pq").value="";$("#pr").innerHTML="";$("#pq").focus()}

/* misioneros: cuántas cargó cada uno y cuánta plata entregó */
function misData(){const by={},pg={};T.lista.forEach(x=>{(by[x.kid]=by[x.kid]||[]).push(x)});T.pagos.forEach(p=>{(pg[p.kid]=pg[p.kid]||[]).push(p)});
 const L=T.chicos.map(c=>({n:c.n,c:c.c,ok:1}));Object.keys(by).concat(Object.keys(pg)).forEach(k=>{if(k!==T.puerta&&!L.some(x=>x.n===k)){L.push({n:k,c:0,ok:0})}});
 L.forEach(x=>{x.it=by[x.n]||[];x.pg=pg[x.n]||[];x.k=x.it.length;x.debe=Math.max(x.c,x.k)*T.price;x.pag=x.pg.reduce((s,p)=>s+p.m,0);x.saldo=x.debe-x.pag});return L}
function misV(){const L=misData(),deb=L.reduce((s,x)=>s+Math.max(0,x.saldo),0),sin=L.filter(x=>x.k<x.c).length;
 $("#ab").innerHTML=`<div class="card"><div class="row"><span>Falta que entreguen</span><b>${money(deb)}</b></div><div class="row"><span>Misioneros que no cargaron todas</span><b>${sin}</b></div></div>
 <div class="chips" style="margin-top:12px">${[["todos","Todos"],["deben","Deben plata"],["faltan","Faltan cargar"]].map(([k,n])=>`<button class="chip ${MF===k?"on":""}" onclick="MF='${k}';MX=-1;misV()">${n}</button>`).join("")}</div><input id="mq" placeholder="Buscar misionero" oninput="misL()" autocomplete="off"><div id="ml"></div>`;misL()}
function misL(){const L=misData(),ws=words($("#mq")?$("#mq").value:"");let V=L.map((x,i)=>Object.assign(x,{i})).filter(x=>matches(x.n,ws));
 if(MF==="deben")V=V.filter(x=>x.saldo>0);if(MF==="faltan")V=V.filter(x=>x.k<x.c);
 $("#ml").innerHTML=V.map(x=>`<button class="item" onclick="MX=${MX===x.i?-1:x.i};misL()"><b>${esc(x.n)}</b>${x.ok?"":" ⚠"}<small>${x.k} de ${x.c} cargadas · ${x.saldo>0?"debe "+money(x.saldo):x.saldo<0?"a favor "+money(-x.saldo):"al día ✅"}</small></button>${MX===x.i?misD(x):""}`).join("")||`<p class="mut">No hay misioneros con ese filtro.</p>`}
function misD(x){return `<div class="card" style="margin:6px 0 12px">${x.ok?"":`<p class="err" style="margin-top:0">Este nombre ya no está en la lista de chicos (¿lo corrigieron o se dio de baja?).</p>`}
 <b>Personas que cargó</b>${x.it.length?x.it.map(p=>`<div class="row" style="align-items:center"><span>${esc(p.n)}${p.tel?`<small class="mut" style="display:block">${esc(p.tel)}</small>`:""}</span>${p.ing?`<span class="tag t-Pagada">Entró ${esc(p.ing)}</span>`:`<button class="chip" style="flex:none" onclick="aborrar('${p.id}',this)">Borrar</button>`}</div>`).join(""):`<p class="mut">Ninguna todavía.</p>`}
 <div style="margin-top:12px"><b>Plata</b></div><div class="row"><span>Tiene que entregar</span><b>${money(x.debe)}</b></div>${x.pg.map(p=>`<div class="row"><span class="mut">${esc(p.f)} · ${esc(p.medio)}${p.nota?" · "+esc(p.nota):""}</span><b>${money(p.m)}</b></div>`).join("")}<div class="row"><span>Saldo</span><b>${money(x.saldo)}</b></div>
 <label>Registrar pago</label><input id="pm" type="number" inputmode="numeric" step="1000" value="${x.saldo>0?x.saldo:""}" placeholder="Monto"><div class="chips" style="margin-top:8px"><button class="chip on" data-m="Efectivo" onclick="pmed(this)">Efectivo</button><button class="chip" data-m="Transferencia" onclick="pmed(this)">Transferencia</button></div><input id="pn" placeholder="Nota (opcional)"><button class="btn pri" onclick="apago(${x.i},this)">Registrar pago</button><p class="mut" style="font-size:.85rem;margin:0">Para corregir un pago mal cargado, registrá el mismo monto en negativo.</p></div>`}
function pmed(b){document.querySelectorAll("[data-m]").forEach(c=>c.classList.toggle("on",c===b))}
async function apago(i,b){const x=misData()[i],m=Math.round(Number($("#pm").value)||0),medio=(document.querySelector("[data-m].on")||{}).dataset.m||"Efectivo";if(!m)return toast("Escribí el monto.");
 b.disabled=true;b.textContent="Registrando…";const r=await adm("pago",{kid:x.n,monto:m,medio,nota:$("#pn").value}).catch(()=>({ok:false,error:"Sin conexión"}));if(!r.ok){b.disabled=false;b.textContent="Registrar pago";return toast(r.error)}
 await cargarT();toast("✔ Pago de "+money(m)+" registrado ("+x.n+")");misL()}
async function aborrar(id,b){if(b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="¿Seguro?";b.classList.add("warn");return}b.disabled=true;const r=await adm("borrar",{id}).catch(()=>({ok:false,error:"Sin conexión"}));if(!r.ok){b.disabled=false;return toast(r.error)}await cargarT();toast("Borrada.");misL()}

/* resumen */
function resV(){const L=T.lista,M=misData(),pu=L.filter(x=>x.kid===T.puerta).length,e=L.filter(x=>x.ing).length,row=(a,b)=>`<div class="row"><span>${a}</span><b>${b}</b></div>`;
 const debe=M.reduce((s,x)=>s+x.debe,0),pag=T.pagos.reduce((s,p)=>s+p.m,0),ef=T.pagos.filter(p=>p.medio==="Efectivo").reduce((s,p)=>s+p.m,0);
