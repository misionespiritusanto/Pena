async function get(q){const r=await fetch(API+(q||""));return r.json()}

/* ---------- carga de datos ---------- */
async function loadData(){const d=await get(),c=d.config||{};
 const set=(k,f)=>{if(c[k]!==undefined&&c[k]!=="")f(c[k])};
 set("Precio de la entrada ($)",v=>CFG.price=Number(v));set("Entradas por chico",v=>CFG.per=Number(v));set("Fecha y hora",v=>CFG.date=String(v));set("Lugar",v=>CFG.where=String(v));set("Destino de lo recaudado",v=>CFG.cause=String(v));set("Días para pagar una reserva",v=>CFG.days=Number(v));set("Texto de la portada",v=>CFG.desc=String(v));set("WhatsApp de contacto",v=>CFG.wa=String(v).replace(/\D/g,""));set("Mail de contacto",v=>CFG.mail=String(v));
 KIDS=[];AV={};(d.chicos||[]).forEach(x=>{KIDS.push(x.n);AV[x.n]={c:Number(x.cupo),p:Number(x.p),g:Number(x.g)}});
 BANDS=(d.bandas||[]).filter(b=>b);MENU=d.menu||[];
 if(!matchMedia("(prefers-color-scheme: dark)").matches){const m={"Fondo":"--bg","Tarjetas":"--card","Texto":"--ink","Color principal":"--brown","Botones secundarios":"--sec","Acento (precios)":"--acc"};Object.keys(m).forEach(k=>{if(/^#[0-9a-f]{6}$/i.test(c[k]||""))document.documentElement.style.setProperty(m[k],c[k])})}
 const f=c["Fuente (nombre de Google Fonts)"];if(f&&f!=="Bricolage Grotesque"){const l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family="+encodeURIComponent(f).replace(/%20/g,"+")+":wght@400;500;700;800&display=swap";document.head.appendChild(l);const st=document.createElement("style");st.textContent='*{font-family:"'+String(f).replace(/"/g,"")+'",system-ui,sans-serif !important}';document.head.appendChild(st)}
 LOADED=true}

function flot(on){const L=$("#flot");if(!on||!FLOT.length){L.innerHTML="";L.dataset.on="";return}if(L.dataset.on)return;L.dataset.on="1";
 const n=Math.min(FLOT.length,innerWidth<700?5:9),pos=[[2,6],[78,4],[6,40],[84,34],[3,74],[80,68],[88,90],[60,14],[22,20]];
 L.innerHTML=FLOT.slice(0,n).map((f,i)=>{const [x,y]=pos[i%pos.length],r=(i%2?1:-1)*(4+i%3*3),d=18+i%4*5;return `<figure class="pol" style="left:${x}%;top:${y}%;--r:${r}deg;animation-duration:${d}s;animation-delay:-${i*3}s"><img src="${esc(f)}" alt="" loading="lazy"></figure>`}).join("")}

/* ---------- portada ---------- */
function home(){if(!LOADED)return W(`<h1>PEÑA${cross}</h1><p>No pudimos cargar los datos.</p><button class="btn pri" onclick="start()">Reintentar</button>`);
 W(`<h1>PEÑA${cross}</h1><div class="sub">GRUPO MISIONERO · PARROQUIA ESPÍRITU SANTO</div>${CFG.where?`<div class="where">📍 ${esc(CFG.where)}</div>`:""}${CFG.date?`<div class="when">${esc(CFG.date)}</div>`:""}<div class="ico">${["guitar","mate","flag","poncho","bombo"].map(ico).join("")}</div><p>${esc(CFG.desc)}</p><div class="price">${money(CFG.price)}</div><div class="mut">cada entrada${CFG.cause?" · "+esc(CFG.cause):""}</div>
 <button class="btn pri" onclick="buy(1)">Comprar entradas</button><button class="btn" onclick="mi()">Ver mi entrada</button><button class="btn" onclick="mision()">¿Para qué es la peña?</button>${BANDS.length?`<button class="btn" onclick="bands()">Ver bandas</button>`:""}${MENU.length?`<button class="btn" onclick="menu()">Ver menú</button>`:""}<button class="btn o" onclick="mine()">Soy misionero: ¿cuántas vendí?</button>${wa()}`,true)}

function mision(){W(`<h1 class="s">¿PARA QUÉ ES LA PEÑA?</h1><div class="card"><p>Somos el <b>Grupo Misionero de la Parroquia Espíritu Santo</b> de San Isidro: más de 150 jóvenes que en febrero viajamos a <b>San Pedro, Córdoba</b>, a misionar durante una semana.</p><p>Visitamos casa por casa, compartimos la tarde con los chicos y jóvenes del pueblo en la plaza, celebramos misa y nos encontramos con los adultos de la comunidad.</p><p>Todo lo que recaudemos en la peña va a pagar ese viaje. <b>¡Gracias por ayudarnos a llegar!</b></p></div>${FOTOS.length?`<div class="gal">${FOTOS.map(f=>`<img src="${esc(f)}" alt="Grupo Misionero Espíritu Santo" loading="lazy">`).join("")}</div>`:""}<button class="btn pri" onclick="buy(1)">Comprar entradas</button>${back("home()")}`)}
function bands(){W(`<h1 class="s">BANDAS</h1><div class="sub">${esc(CFG.date)}</div><div style="margin-top:14px">${BANDS.map((b,i)=>`<div class="band" style="transform:rotate(${i%2?1.2:-1.2}deg)">${esc(b)}</div>`).join("")}</div>${back("home()")}`)}
function menu(){W(`<h1 class="s">MENÚ</h1><div style="margin-top:12px">${MENU.map(([t,r])=>`<div class="card" style="margin-bottom:14px"><h2>${esc(String(t).toUpperCase())}</h2>${r.map(([n,p])=>`<div class="row"><span>${esc(n)}</span><b>${money(p)}</b></div>`).join("")}</div>`).join("")}</div>${back("home()")}`)}
function priv(){W(`<h1 class="s">PRIVACIDAD</h1><div class="card"><p>La peña la organiza el <b>Grupo Misionero de la Parroquia Espíritu Santo</b>.</p><p><b>Qué datos pedimos:</b> nombre, teléfono y mail de quien compra, el nombre de cada asistente y, si pagás por transferencia, el comprobante. Los usamos solo para registrar tu compra, confirmar el pago y armar la lista de ingreso.</p><p><b>Quién los ve:</b> los coordinadores del Grupo Misionero a cargo de las entradas. Los misioneros solo ven cuántas entradas vendieron.</p><p>No usamos publicidad ni cookies de seguimiento, y no compartimos tus datos con terceros, salvo los servicios de Google donde se guardan.</p><p><b>Tus derechos:</b> podés pedir ver, corregir o borrar tus datos escribiendo a <b>${esc(CFG.mail)}</b> (Ley 25.326).</p></div>${wa()}${back("home()")}`)}

/* ---------- compra ---------- */
let F={};
function list(q,fn,dis){const k=norm(q);const L=KIDS.filter(x=>norm(x).includes(k));return L.slice(0,8).map(x=>{const i=KIDS.indexOf(x),r=disp(x);return `<button class="item" ${dis&&!r?"disabled":""} onclick="${fn}(${i})">${esc(x)}${dis?`<small>${r?r+(r>1?" entradas disponibles":" entrada disponible"):"Sin entradas disponibles"}</small>`:""}</button>`}).join("")+(L.length>8?`<p class="mut" style="font-size:.9rem">Hay más: escribí alguna letra más.</p>`:"")||"<p>No encontramos ese nombre.</p>"}
function flt(){$("#l").innerHTML=$("#s").value.trim()?list($("#s").value,"pick",1):""}
function pick(i){F.kid=KIDS[i];F.q=1;buy(2)}
function tot(){return F.q*CFG.price+(F.colab||0)}
function qd(d){F.q=Math.min(disp(F.kid),Math.max(1,F.q+d));$("#q").textContent=F.q;$("#tt").textContent=money(tot())}
function cb(v){F.colab=Math.min(1000000,Math.max(0,Math.round(Number(v)||0)));document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",Number(c.dataset.v)===F.colab));if($("#co")&&document.activeElement!==$("#co"))$("#co").value="";$("#tt").textContent=money(tot())}
function buy(n){
 let aviso="";if(n==1){const pre=F.pre;F={kid:"",q:1,colab:0,name:"",tel:"",mail:"",g:[],pay:""};if(pre){if(KIDS.includes(pre)&&disp(pre)){F.kid=pre;n=2}else aviso=KIDS.includes(pre)?`<p class="card">${esc(pre)} ya no tiene entradas disponibles. ¡Podés comprarle a otro misionero!</p>`:`<p class="card">No encontramos a “${esc(pre)}” en la lista. Buscá al misionero por su nombre.</p>`}}
 const bar=`<div class="bar">${[1,2,3,4].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div>`,sub=`<p class="mut">Le estás comprando a <b>${esc(F.kid)}</b></p>`;let h="";
 if(n==1)h=aviso+`<h2>¿A qué misionero le comprás?</h2><label>Nombre</label><input id="s" placeholder="Escribí su nombre" oninput="flt()" autocomplete="off"><div id="l" style="margin-top:10px"></div>`;
 if(n==2){const r=disp(F.kid);h=`<h2>¿Cuántas entradas?</h2>${sub}<p class="mut">Le ${r>1?"quedan":"queda"} ${r} disponible${r>1?"s":""}.</p><div class="qty"><button class="btn o" onclick="qd(-1)" aria-label="Menos">−</button><b id="q">${F.q}</b><button class="btn o" onclick="qd(1)" aria-label="Más">+</button></div>
  <label>¿Querés sumar una colaboración? <span class="mut" style="font-weight:500">(opcional)</span></label><div class="chips">${[0,5000,10000,20000].map(v=>`<button class="chip ${F.colab===v?"on":""}" data-v="${v}" onclick="cb(${v})">${v?money(v):"No, gracias"}</button>`).join("")}</div><input id="co" type="number" inputmode="numeric" min="0" step="1000" placeholder="Otro monto" value="${F.colab&&![5000,10000,20000].includes(F.colab)?F.colab:""}" oninput="cb(this.value)">
  <p class="total">Total: <b id="tt">${money(tot())}</b></p><button class="btn pri" onclick="buy(3)">Continuar</button>`}
 if(n==3)h=`<h2>Tus datos</h2>${sub}<label>Nombre y apellido</label><input id="n" value="${esc(F.name)}" autocomplete="name"><label>Teléfono</label><input id="t" type="tel" value="${esc(F.tel)}" autocomplete="tel"><label>Mail</label><input id="m" type="email" value="${esc(F.mail)}" autocomplete="email">${Array.from({length:F.q-1},(_,i)=>`<label>Nombre de la persona ${i+2}</label><input class="gi" value="${esc(F.g[i]||"")}">`).join("")}<p class="mut" style="font-size:.9rem">Cada persona tiene su propia entrada con QR.</p><p id="err" class="err"></p><button class="btn pri" onclick="s3()">Continuar</button>`;
 if(n==4)h=`<h2>¿Cómo pagás?</h2>${sub}<p>Total: <b>${money(tot())}</b></p><label class="opt"><input type="radio" name="p" value="Transferencia" ${F.pay=="Transferencia"?"checked":""}> <span>Transferencia<small>Escaneás un QR y subís el comprobante</small></span></label><label class="opt"><input type="radio" name="p" value="Efectivo" ${F.pay=="Efectivo"?"checked":""}> <span>Efectivo<small>Le pagás a ${esc(F.kid)}</small></span></label><p id="err" class="err"></p><button class="btn pri" onclick="done()">Reservar</button>`;
 W(`${bar}${h}${back(n>1?"buy("+(n-1)+")":"home()")}`);if(n==1){$("#s").focus();flt()}}
function s3(){F.name=$("#n").value.trim();F.tel=$("#t").value.trim();F.mail=$("#m").value.trim();F.g=[...document.querySelectorAll(".gi")].map(e=>e.value.trim());
 if(!F.name||F.tel.replace(/\D/g,"").length<8||!/.+@.+\..+/.test(F.mail)||F.g.some(x=>!x))return $("#err").textContent="Completá nombre, teléfono, mail y el nombre de cada persona.";buy(4)}
async function done(){const p=document.querySelector("input[name=p]:checked");if(!p)return $("#err").textContent="Elegí cómo pagás.";F.pay=p.value;
 const b=$(".btn.pri");b.disabled=true;b.textContent="Reservando…";
 try{const r=await post({action:"reservar",kid:F.kid,q:F.q,colab:F.colab,name:F.name,tel:F.tel,mail:F.mail,g:F.g,pay:F.pay});
  if(!r.ok){b.disabled=false;b.textContent="Reservar";return $("#err").textContent=r.error||"No se pudo reservar."}
  loadData().catch(()=>{});SES={code:r.code,mail:F.mail};reserva(r.code,r.total)}catch(e){b.disabled=false;b.textContent="Reservar";$("#err").textContent="No pudimos conectar. Revisá tu internet y probá de nuevo."}}
let SES=null;
const payBox=t=>`<p>1. Escaneá este QR con la app de tu banco o billetera y pagá <b>${money(t)}</b>.</p><div class="pqr"><img src="${PAYQR}" alt="QR de pago"></div><p class="mut" style="font-size:.9rem">Si la app te pide el monto, ingresá ${money(t)}. El pago figura a nombre de “Parroquia Espíritu Santo”.</p>`;
const upBox=()=>`<p>2. Subí el comprobante (PDF o captura de pantalla):</p><label class="btn" style="text-align:center">📎 Elegir comprobante<input id="up" type="file" accept="image/*,application/pdf" hidden onchange="subir(this)"></label><p id="upm" class="mut" style="text-align:center"></p>`;
function reserva(code,t){W(`<h1 class="s">¡RESERVADO!</h1><div class="card"><p>Reservamos <b>${F.q}</b> ${F.q>1?"entradas":"entrada"} (a ${esc(F.kid)}). Tu código es <b class="code">${code}</b> — anotalo.</p>${F.pay=="Transferencia"?payBox(t)+upBox():`<p>Pagale <b>${money(t)}</b> en efectivo a <b>${esc(F.kid)}</b> y decile tu código <b>${code}</b>. Cuando nos llegue la plata, se activan tus entradas.</p>`}<p class="mut" style="font-size:.9rem">Tus entradas con QR aparecen en <b>“Ver mi entrada”</b> (con tu código y tu mail) apenas se confirme el pago. ${F.pay=="Transferencia"?` Si no subís el comprobante en ${CFG.days} días, la reserva se libera.`:""}</p></div>${wa()}<button class="btn" onclick="mi('${code}')">Ver mi entrada</button><button class="btn o" onclick="home()">Volver al inicio</button>`)}

/* ---------- subir comprobante ---------- */
function achicar(file){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.88).split(",")[1])};img.onerror=()=>no(new Error("img"));img.src=u})}
const b64=file=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(file)});
async function subir(inp){const f=inp.files[0],m=$("#upm");if(!f||!SES)return;inp.disabled=true;m.textContent="Subiendo y verificando… (puede tardar unos segundos)";
 try{let data,mime;if(f.type==="application/pdf"){if(f.size>7e6)return m.textContent="El PDF es muy pesado. Probá con una captura.";data=await b64(f);mime="application/pdf"}else{data=await achicar(f);mime="image/jpeg"}
  const r=await post({action:"comprobante",code:SES.code,mail:SES.mail,mime,data});inp.disabled=false;inp.value="";if(!r.ok){m.textContent=/^Error del sistema/.test(r.error||"")?"No pudimos procesar el comprobante en este momento. Probá de nuevo en un rato o escribinos por WhatsApp.":(r.error||"No se pudo subir.");return}
  if(r.estado==="Pagada"){m.innerHTML="<b>"+esc(r.msg)+"</b>";setTimeout(()=>buscarMi(SES.code,SES.mail),900)}else m.innerHTML=esc(r.msg)}catch(e){inp.disabled=false;m.textContent="No pudimos subir el archivo. Probá de nuevo o con otro formato."}}

/* ---------- ver mi entrada ---------- */
function mi(pre){W(`<h1 class="s">MI ENTRADA</h1><p class="mut">Ingresá el código de tu reserva y el mail con el que compraste.</p><label>Código</label><input id="mc" placeholder="Ej: AB12C" value="${esc(pre||(SES&&SES.code)||"")}" autocapitalize="characters"><label>Mail</label><input id="mm" type="email" value="${esc((SES&&SES.mail)||"")}"><p id="err" class="err"></p><button class="btn pri" onclick="mq()">Ver mis entradas</button>${wa()}${back("home()")}`)}
function mq(){const bt=$(".btn.pri");if(bt){bt.disabled=true;bt.textContent="Buscando…"}const c=$("#mc").value.trim().toUpperCase().replace(/^PENA-/,"").split("-")[0],m=$("#mm").value.trim();if(!c||!m){if(bt){bt.disabled=false;bt.textContent="Ver mis entradas"}return $("#err").textContent="Completá el código y el mail."}buscarMi(c,m).finally(()=>{if(bt&&document.body.contains(bt)){bt.disabled=false;bt.textContent="Ver mis entradas"}})}
async function buscarMi(c,m){try{const r=await get("?action=entrada&code="+encodeURIComponent(c)+"&mail="+encodeURIComponent(m));if(!r.ok){if($("#err"))$("#err").textContent=r.error||"No encontramos esa reserva.";return}SES={code:c,mail:m};ver(r)}catch(e){if($("#err"))$("#err").textContent="No pudimos conectar. Probá de nuevo."}}
function ver(r){const it=r.items,tk=it.filter(x=>x.e==="Pagada"),pe=it.filter(x=>x.e==="Pendiente"),an=it.filter(x=>x.e==="Anulada");
 W(`<h1 class="s">MIS ENTRADAS</h1>${tk.map(x=>`<div class="card tk"><div class="qr">${qr(TKURL(x.id))}</div><b>${esc(x.n)}</b><small class="mut">${esc(x.id)}</small></div>`).join("")}${tk.length?`<p class="mut" style="font-size:.9rem">Mostrá cada QR en la puerta (uno por persona). Sacales captura por si falla internet.</p>`:""}
 ${pe.length?`<div class="card" style="margin:12px 0"><p><b>${pe.length} ${pe.length>1?"entradas pendientes":"entrada pendiente"} de pago.</b></p>${pe[0].p==="Transferencia"?(r.enviado?`<p>Ya recibimos tu comprobante y lo estamos revisando. Si te equivocaste de archivo, podés subir otro.</p>`:payBox(r.monto))+upBox():`<p>Pagá ${money(r.monto)} en efectivo al misionero que te vendió, con el código <b>${esc(r.code)}</b>.</p>`}</div>`:""}
 ${an.length?`<p class="mut">${an.length} ${an.length>1?"entradas anuladas":"entrada anulada"}.</p>`:""}${wa()}${back("home()")}`)}

/* ---------- misioneros: cuántas vendí ---------- */
let P=[];
function mine(){W(`<h1 class="s">¿CUÁNTAS VENDÍ?</h1><label>Tu nombre</label><input id="s" placeholder="Escribí tu nombre" oninput="mf()" autocomplete="off"><div id="l"></div><div id="c"></div>${back("home()")}`);mc()}
function mf(){$("#l").innerHTML=$("#s").value.trim()?list($("#s").value,"mp",0):""}
function mp(i){P=[i];$("#s").value="";mf();mc()}
function mc(){$("#c").innerHTML=P.map(i=>{const k=KIDS[i],a=AV[k]||{c:CFG.per,p:0,g:0},t=a.c,link=location.origin+location.pathname+"?m="+encodeURIComponent(k);return `<div class="card" style="margin-top:14px"><b>${esc(k)}</b><div style="margin:8px 0"><b style="font-size:2.2rem">${a.g}</b> de ${t} pagadas${a.p?` · ${a.p} esperando pago`:""}</div><div class="prog"><b style="width:${Math.min(100,a.g/t*100)}%"></b></div>${a.g>=t?"<p>¡Vendiste todas! 🎉</p>":`<p class="mut">Te ${t-a.g-a.p===1?"queda":"quedan"} ${Math.max(0,t-a.g-a.p)} para vender.</p>`}<p style="font-size:.92rem">Tu link personal (ya trae tu nombre elegido):</p><input readonly value="${esc(link)}" onclick="this.select()"><button class="btn" onclick="copiar('${esc(link).replace(/'/g,"\\'")}',this)">Copiar mi link</button></div>`}).join("")}
function copiar(t,b){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent="¡Copiado!"},()=>{b.textContent="Mantené apretado el link para copiarlo"})}

/* ---------- administración (#admin) ---------- */
let K="";try{K=localStorage.getItem("pk")||sessionStorage.getItem("pk")||""}catch(e){}
const adm=(op,o)=>post(Object.assign({action:"admin",clave:K,op},o||{}));
function admin(){if(!K)return W(`<h1 class="s">ADMIN</h1><label>Clave</label><input id="ak" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')alog()"><label class="opt"><input type="checkbox" id="arec"> <span>Recordar en este celular<small>Para los celulares de la puerta</small></span></label><p id="err" class="err"></p><button class="btn pri" onclick="alog()">Entrar</button>${back("salirAdmin()")}`);atab("buscar")}
async function alog(){K=$("#ak").value;const r=await adm("login").catch(()=>({ok:false,error:"Sin conexión"}));if(!r.ok){K="";return $("#err").textContent=r.error}try{($("#arec")&&$("#arec").checked?localStorage:sessionStorage).setItem("pk",K)}catch(e){}if(PEND_IN){const i=PEND_IN;PEND_IN="";return inq(i)}atab("buscar")}
function salirAdmin(){K="";try{sessionStorage.removeItem("pk");localStorage.removeItem("pk")}catch(e){}stopCam();location.hash="";home()}
function atab(t){stopCam();const tabs=[["buscar","Buscar"],["revisar","Pendientes"],["puerta","Puerta"],["resumen","Resumen"]];
 W(`<h1 class="s">ADMIN</h1><div class="tabs">${tabs.map(([k,n])=>`<button class="${k===t?"on":""}" onclick="atab('${k}')">${n}</button>`).join("")}</div><div id="ab"></div><button class="back" onclick="salirAdmin()">Salir</button>`);
 if(t==="buscar"){$("#ab").innerHTML=`<input id="aq" placeholder="Código, comprador, misionero o mail" onkeydown="if(event.key==='Enter')abus()"><button class="btn pri" onclick="abus()">Buscar</button><div id="ar"></div>`;$("#aq").focus()}
 if(t==="revisar")abus(true);if(t==="puerta")puerta();if(t==="resumen")ares()}
async function abus(rev){const ar=rev?$("#ab"):$("#ar");ar.innerHTML="<p class='mut'>Buscando…</p>";const r=await adm("buscar",{q:rev?"":$("#aq").value,revisar:!!rev}).catch(()=>({ok:false,error:"Sin conexión"}));if(!r.ok)return ar.innerHTML=`<p class="err">${esc(r.error)}</p>`;
 ar.innerHTML=(rev?`<p class="mut">Todas las reservas sin pagar: efectivo por cobrar, comprobantes para revisar y transferencias sin comprobante.</p>`:"")+(r.items.length?r.items.map(acard).join(""):"<p class='mut'>No hay resultados.</p>")+(r.mas?"<p class='mut'>Hay más resultados: buscá algo más específico.</p>":"")}
function acard(x){const est=x.estado,pend=est.includes("Pendiente");return `<div class="card ac" id="r-${x.code}"><div class="ach"><b class="code">${x.code}</b><span class="tag t-${est.split(" ")[0]}">${esc(est)}</span></div>
 <div>${esc(x.comp)} · ${esc(x.tel)}<br><span class="mut">${esc(x.mail)}</span></div><div class="mut">Misionero: <b>${esc(x.chico)}</b> · ${esc(x.pago)} · ${esc(x.fecha)}</div><div><b>${money(x.total)}</b> · ${x.asis.map(a=>esc(a.n)+(a.ing?" ✅"+a.ing:"")).join(", ")}</div>${x.verif?`<div class="mut" style="font-size:.85rem">🔎 ${esc(x.verif)}</div>`:""}${x.link?`<a class="btn o" href="${esc(x.link)}" target="_blank" rel="noopener">Ver comprobante</a>`:""}
 <div class="acts">${pend?`<button class="btn pri" onclick="aest('${x.code}','Pagada','Efectivo',this)">Cobrado en efectivo</button>${x.link||x.pago==="Transferencia"?`<button class="btn" onclick="aest('${x.code}','Pagada','Transferencia',this)">Aprobar transferencia</button>`:""}`:""}${est!=="Pendiente"?`<button class="btn o" onclick="aest('${x.code}','Pendiente','',this)">Volver a pendiente</button>`:""}${!est.includes("Anulada")?`<button class="btn o warn" onclick="aest('${x.code}','Anulada','',this)">Anular</button>`:""}</div></div>`}
async function aest(code,e,medio,b){if(e==="Anulada"&&b.dataset.ok!=="1"){b.dataset.ok="1";b.textContent="Tocá de nuevo para anular";return}
 b.disabled=true;const r=await adm("estado",{code,estado:e,medio}).catch(()=>({ok:false,error:"Sin conexión"}));if(!r.ok){b.disabled=false;return alert2(r.error)}
 const c=$("#r-"+code);if(c)c.outerHTML=`<div class="card ok">✔ ${code}: ${e==="Pagada"?"pagada"+(medio?" ("+medio.toLowerCase()+")":""):e.toLowerCase()} — ${r.n} ${r.n>1?"entradas":"entrada"}.</div>`;loadData().catch(()=>{})}
function alert2(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
async function ares(){$("#ab").innerHTML="<p class='mut'>Cargando…</p>";const r=await adm("resumen").catch(()=>({ok:false,error:"Sin conexión"}));if(!r.ok)return $("#ab").innerHTML=`<p class="err">${esc(r.error)}</p>`;
 const row=(a,b)=>`<div class="row"><span>${a}</span><b>${b}</b></div>`;$("#ab").innerHTML=`<div class="card">${row("Entradas pagadas",r.pagadas)}${row("Pendientes de pago",r.pendientes)}${row("Comprobantes para revisar",r.revisar)}${row("Ya ingresaron",r.ingresaron)}${r.capacidad?row("Lugares libres",r.capacidad-r.pagadas-r.pendientes):""}</div><div class="card" style="margin-top:12px">${row("Total cobrado",money(r.total))}${row("· por QR (transferencia)",money(r.transf))}${row("· en efectivo",money(r.efectivo))}${row("Por cobrar",money(r.porCobrar))}</div><p class="mut" style="font-size:.9rem">Para controlar con María Ángela: lo que te pase del QR tiene que coincidir con “por QR”.</p>`}
/* entrada escaneada con la cámara del celular (abre ...#in=PENA-XXXXX-1) */
let PEND_IN="";
function inq(raw){const id=tkid(raw);try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}if(!K){PEND_IN=id;return W(`<h1 class="s">TU ENTRADA</h1><div class="card"><p>Esta es una entrada de la peña${id?` (<b class="code">${esc(id)}</b>)`:""}. Mostrá el QR en la puerta el día de la peña para entrar.</p></div><button class="btn" onclick="mi()">Ver mis entradas</button><button class="btn o" onclick="home()">Ir al inicio</button><button class="back" onclick="admin()">Soy de la puerta</button>`)}W(`<h1 class="s">PUERTA</h1><div id="pres" class="pres">Verificando…</div><button class="btn pri" onclick="atab('puerta')">Escanear otra con la página</button><button class="back" onclick="salirAdmin()">Salir</button>`);ping(id)}
/* puerta: escáner de QR */
let CAM=null,LAST="",LT=0;
function puerta(){$("#ab").innerHTML=`<div id="pres" class="pres">Apuntá la cámara al QR de la entrada</div><video id="v" playsinline muted></video><canvas id="cv" hidden></canvas><button class="btn pri" id="camb" onclick="startCam()">Activar cámara</button><label>O escribí el código de la entrada</label><input id="pc" placeholder="PENA-AB12C-1" autocapitalize="characters" onkeydown="if(event.key==='Enter')ping(this.value)"><button class="btn" onclick="ping($('#pc').value)">Registrar ingreso</button>`}
async function startCam(){try{CAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});const v=$("#v");v.srcObject=CAM;await v.play();$("#camb").style.display="none";loopCam()}catch(e){$("#pres").textContent="No se pudo abrir la cámara. Usá el código a mano."}}
function stopCam(){if(CAM){CAM.getTracks().forEach(t=>t.stop());CAM=null}}
let BD=null;try{if("BarcodeDetector" in window)BD=new BarcodeDetector({formats:["qr_code"]})}catch(e){}
const hit=t=>{if(t&&(t!==LAST||Date.now()-LT>4000)){LAST=t;LT=Date.now();ping(t)}};
let BUSY=false;function loopCam(){if(!CAM)return;const v=$("#v"),c=$("#cv");if(v&&v.readyState>=2&&BD&&!BUSY){BUSY=true;BD.detect(v).then(r=>{if(r[0])hit(r[0].rawValue)}).catch(()=>{BD=null}).finally(()=>{BUSY=false})}else if(v&&v.readyState>=2&&!BD&&window.jsQR){c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(v,0,0);const d=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:"dontInvert"});if(d&&d.data)hit(d.data)}requestAnimationFrame(loopCam)}
const tkid=t=>(String(t||"").toUpperCase().match(/PENA-[A-Z0-9]{5}-\d{1,2}/)||[""])[0];
async function ping(raw){const p=$("#pres"),id=tkid(raw);if(!String(raw||"").trim())return;if(!id){p.className="pres bad";p.innerHTML="<b>✖ QR NO VÁLIDO</b><small>No es una entrada de la peña.</small>";return}p.className="pres";p.textContent="Verificando "+id+"…";
 const r=await adm("ingreso",{id}).catch(()=>({ok:false,error:"Sin conexión: anotá el código y revisá la lista impresa"}));if(!r.ok){p.className="pres bad";return p.textContent=r.error}
 p.className="pres "+(r.res==="ok"?"good":r.res==="usada"?"warn":"bad");p.innerHTML=`<b>${r.res==="ok"?"✔ PUEDE PASAR":r.res==="usada"?"⚠ YA USADA":"✖ NO PASA"}</b>${r.nombre?`<span>${esc(r.nombre)}</span>`:""}<small>${esc(r.msg)}</small>`;if(navigator.vibrate)navigator.vibrate(r.res==="ok"?80:[60,60,60])}

/* ---------- arranque ---------- */
const D=[["guitar",3,8,120,-18,"d1"],["mate",86,5,100,12,"d2"],["flag",90,28,110,8,"d3"],["poncho",2,33,110,-8,"d4"],["bombo",85,55,120,-10,"d1"],["hat",3,58,110,10,"d2"],["note",10,84,80,-12,"d3"],["empanada",80,84,100,8,"d4"],["sun",44,91,80,0,"d2"],["note",92,78,70,14,"d1"],["mate",40,-2,90,-8,"d4"],["guitar",70,68,100,20,"d3"]];
$("#deco").innerHTML=D.map(([n,x,y,z,r,c])=>`<svg viewBox="0 0 100 100" style="left:${x}%;top:${y}%;width:${z}px;height:${z}px;transform:rotate(${r}deg);color:var(--${c})"><use href="#${n}"/></svg>`).join("");
function route(){if(location.hash.indexOf("#in=")===0)return inq(decodeURIComponent(location.hash.slice(4)));if(location.hash==="#admin")return admin();home()}
async function start(){W("<p>Cargando…</p>");try{await loadData()}catch(e){}const m=new URLSearchParams(location.search).get("m");if(m)F.pre=m;
 if(location.hash.indexOf("#in=")===0||location.hash==="#admin")return route();if(F.pre&&LOADED&&KIDS.includes(F.pre)&&disp(F.pre))return buy(1);home()}
addEventListener("hashchange",route);
start();

</script></body></html>
